name: Offline runtime qualification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  durable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify recorded artifact bytes from the checkout
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('docs/evidence/durable')
          manifest = json.loads((root / 'manifest.json').read_text())
          for name, expected in manifest['artifact_sha256'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          print('Verified', len(manifest['artifact_sha256']), 'recorded artifact hashes')
          PY
      - run: python -m unittest discover -s durable/tests -v
      - run: python -m durable.experiment --output qualification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: durable-qualification
          path: qualification
  summary-and-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.0.2 matplotlib==3.10.8 numpy==2.4.2 poetry-core==2.3.1
      - run: python -m pytest metrics/tests/test_summary.py benchmarks/tests/test_reporter.py benchmarks/tests/test_visualization.py -q
      - run: python scripts/check_wheel.py
